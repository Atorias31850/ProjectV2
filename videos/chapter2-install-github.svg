<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="ติดตั้ง Git และเชื่อม GitHub">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#060b14" />
      <stop offset="0.55" stop-color="#0d1525" />
      <stop offset="1" stop-color="#07111f" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(0,255,136,0.08)" stroke-width="1" />
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)" />
  <rect width="1280" height="720" fill="url(#grid)" />
  <circle cx="1080" cy="90" r="210" fill="#00d4ff" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="200;230;200" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08;0.16;0.08" dur="5s" repeatCount="indefinite" />
  </circle>
  <text x="72" y="48" fill="#00d4ff" font-family="Consolas, monospace" font-size="22" font-weight="700">~/git-learn</text>
  <text x="72" y="108" fill="#e8f4f8" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="800">ติดตั้ง Git และเชื่อม GitHub</text>
  <text x="74" y="156" fill="#8ba3bc" font-family="Segoe UI, Arial, sans-serif" font-size="28">Windows, macOS, Linux</text>
  <g opacity="0.35">
      <animate attributeName="opacity" values="0.35;1;1;0.55" dur="7s" begin="0.0s" repeatCount="indefinite" />
      <rect x="72" y="214" width="1136" height="68" rx="12" fill="#111927" stroke="#00d4ff" stroke-opacity="0.35" />
      <rect x="72" y="214" width="0" height="68" rx="12" fill="#00d4ff" opacity="0.10">
        <animate attributeName="width" values="0;1136;1136" dur="7s" begin="0.0s" repeatCount="indefinite" />
      </rect>
      <text x="100" y="257" fill="#00d4ff" font-family="Consolas, monospace" font-size="26" font-weight="700">01</text>
      <text x="162" y="257" fill="#e8f4f8" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Windows: ดาวน์โหลด Git for Windows และเปิด Git Bash</text>
    </g>
<g opacity="0.35">
      <animate attributeName="opacity" values="0.35;1;1;0.55" dur="7s" begin="1.4s" repeatCount="indefinite" />
      <rect x="72" y="300" width="1136" height="68" rx="12" fill="#111927" stroke="#00d4ff" stroke-opacity="0.35" />
      <rect x="72" y="300" width="0" height="68" rx="12" fill="#00d4ff" opacity="0.10">
        <animate attributeName="width" values="0;1136;1136" dur="7s" begin="1.4s" repeatCount="indefinite" />
      </rect>
      <text x="100" y="343" fill="#00d4ff" font-family="Consolas, monospace" font-size="26" font-weight="700">02</text>
      <text x="162" y="343" fill="#e8f4f8" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">macOS: xcode-select --install หรือ brew install git</text>
    </g>
<g opacity="0.35">
      <animate attributeName="opacity" values="0.35;1;1;0.55" dur="7s" begin="2.8s" repeatCount="indefinite" />
      <rect x="72" y="386" width="1136" height="68" rx="12" fill="#111927" stroke="#00d4ff" stroke-opacity="0.35" />
      <rect x="72" y="386" width="0" height="68" rx="12" fill="#00d4ff" opacity="0.10">
        <animate attributeName="width" values="0;1136;1136" dur="7s" begin="2.8s" repeatCount="indefinite" />
      </rect>
      <text x="100" y="429" fill="#00d4ff" font-family="Consolas, monospace" font-size="26" font-weight="700">03</text>
      <text x="162" y="429" fill="#e8f4f8" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Linux: ใช้ apt, dnf หรือ pacman</text>
    </g>
<g opacity="0.35">
      <animate attributeName="opacity" values="0.35;1;1;0.55" dur="7s" begin="4.2s" repeatCount="indefinite" />
      <rect x="72" y="472" width="1136" height="68" rx="12" fill="#111927" stroke="#00d4ff" stroke-opacity="0.35" />
      <rect x="72" y="472" width="0" height="68" rx="12" fill="#00d4ff" opacity="0.10">
        <animate attributeName="width" values="0;1136;1136" dur="7s" begin="4.2s" repeatCount="indefinite" />
      </rect>
      <text x="100" y="515" fill="#00d4ff" font-family="Consolas, monospace" font-size="26" font-weight="700">04</text>
      <text x="162" y="515" fill="#e8f4f8" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">ตั้งค่า user.name และ user.email</text>
    </g>
<g opacity="0.35">
      <animate attributeName="opacity" values="0.35;1;1;0.55" dur="7s" begin="5.6s" repeatCount="indefinite" />
      <rect x="72" y="558" width="1136" height="68" rx="12" fill="#111927" stroke="#00d4ff" stroke-opacity="0.35" />
      <rect x="72" y="558" width="0" height="68" rx="12" fill="#00d4ff" opacity="0.10">
        <animate attributeName="width" values="0;1136;1136" dur="7s" begin="5.6s" repeatCount="indefinite" />
      </rect>
      <text x="100" y="601" fill="#00d4ff" font-family="Consolas, monospace" font-size="26" font-weight="700">05</text>
      <text x="162" y="601" fill="#e8f4f8" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">เชื่อม GitHub ด้วย remote origin แล้ว push</text>
    </g>
  <rect x="72" y="668" width="1136" height="10" rx="5" fill="rgba(232,244,248,0.12)" />
  <rect x="72" y="668" width="0" height="10" rx="5" fill="#00d4ff">
    <animate attributeName="width" values="0;1136;0" dur="7s" repeatCount="indefinite" />
  </rect>
</svg>